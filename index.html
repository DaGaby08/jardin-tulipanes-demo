<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jardín de tulipanes</title>
<style>
:root{--bg:#faf6f1;--fg:#3a2a33;--card:#fff;--ac:#d6457a}
@media(prefers-color-scheme:dark){:root{--bg:#1b1722;--fg:#f1e8ee;--card:#2a2433}}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,sans-serif;background:var(--bg);color:var(--fg);display:flex;flex-wrap:wrap;gap:20px;justify-content:center;padding:20px}
#stage{flex:1 1 360px;display:flex;justify-content:center;align-items:flex-start}
canvas{max-width:100%;max-height:80vh;border-radius:16px;box-shadow:0 10px 40px #0004}
#panel{flex:0 1 320px;background:var(--card);padding:18px;border-radius:16px;display:flex;flex-direction:column;gap:12px}
h1{margin:0;font-size:1.3rem}
label{font-size:.85rem;display:flex;flex-direction:column;gap:4px}
input,select,button{font:inherit;padding:8px;border-radius:8px;border:1px solid #8884;background:transparent;color:inherit}
button{cursor:pointer;background:var(--ac);color:#fff;border:0;font-weight:600}
button.sec{background:transparent;color:var(--fg);border:1px solid #8886}
.row{display:flex;gap:8px}.row>*{flex:1}
#msg{font-size:.8rem;min-height:1em;opacity:.8}
</style>
</head>
<body>
<div id="stage"><canvas id="c"></canvas></div>
<div id="panel">
  <h1>🌷 Mi jardín de tulipanes</h1>
  <div class="row">
    <button class="sec" id="dia">☀️ Día</button>
    <button class="sec" id="noche">🌙 Noche</button>
  </div>
  <label>Formato
    <select id="fmt"><option value="p">Celular (vertical)</option><option value="l">Laptop (horizontal)</option></select>
  </label>
  <label>Texto
    <input id="txt" value="Para ti 🌷" maxlength="60">
  </label>
  <label>Letra
    <select id="font">
      <option value="Georgia, serif">Elegante</option>
      <option value="'Brush Script MT', cursive">Manuscrita</option>
      <option value="system-ui, sans-serif">Moderna</option>
      <option value="'Courier New', monospace">Máquina</option>
    </select>
  </label>
  <label>Color de tulipanes
    <select id="col">
      <option value="mix">Mixtos</option><option value="330">Rosa</option><option value="350">Rojo</option>
      <option value="48">Amarillo</option><option value="280">Morado</option><option value="22">Naranja</option><option value="0w">Blanco</option>
    </select>
  </label>
  <label>Cantidad de tulipanes
    <input type="range" id="n" min="8" max="60" value="30">
  </label>
  <button class="sec" id="seed">🌱 Replantar jardín</button>
  <button id="png">⬇️ Descargar fondo (PNG)</button>
  <button id="gif">⬇️ Descargar animado (GIF)</button>
  <div id="msg"></div>
</div>

<script>
const $=id=>document.getElementById(id);
const cv=$('c'),ctx=cv.getContext('2d');
let night=false,seed=1,flowers=[],flies=[];
const TAU=Math.PI*2;
const rnd=s=>()=>(s=(s*16807)%2147483647)/2147483647;

function size(big){const p=$('fmt').value==='p';return big?(p?[1080,1920]:[1920,1080]):(p?[450,800]:[800,450])}

function build(){
  const r=rnd(seed*7919+13),n=+$('n').value,c=$('col').value;
  const hues=[330,350,48,280,22,0];
  flowers=[];
  for(let i=0;i<n;i++){
    const d=r(); // 0 = lejos, 1 = cerca
    let h=c==='mix'?hues[(r()*hues.length)|0]:parseInt(c),white=c==='0w'||(c==='mix'&&h===0);
    flowers.push({x:r(),d,h,white,ph:r(),leaf:r()>.5});
  }
  flowers.sort((a,b)=>a.d-b.d);
  flies=[];
  for(let i=0;i<45;i++)flies.push({x:r(),y:.35+r()*.6,fx:1+((r()*3)|0),fy:1+((r()*3)|0),p:r(),q:r(),g:r(),s:.6+r()});
}

function tulip(g,x,y,s,f,t){
  const sway=Math.sin(TAU*(t+f.ph))*.08;
  const H=s*3.4,tx=x+Math.sin(sway)*H,ty=y-H*Math.cos(sway);
  g.strokeStyle=night?'#2f6b4a':'#3f9a4f';g.lineWidth=s*.14;g.lineCap='round';
  g.beginPath();g.moveTo(x,y);g.quadraticCurveTo(x+Math.sin(sway)*H*.2,y-H*.5,tx,ty);g.stroke();
  g.fillStyle=night?'#2a5f42':'#4aaa5a';
  const L=f.leaf?1:-1;
  g.beginPath();g.moveTo(x,y);g.quadraticCurveTo(x+L*s*1.3,y-H*.35,x+L*s*.5+Math.sin(sway)*s,y-H*.65);g.quadraticCurveTo(x+L*s*.1,y-H*.3,x,y);g.fill();
  const base=f.white?`hsl(0,0%,${night?82:96}%)`:`hsl(${f.h},75%,${night?42:52}%)`;
  const lite=f.white?`hsl(300,30%,${night?90:100}%)`:`hsl(${f.h},80%,${night?55:66}%)`;
  g.save();g.translate(tx,ty);g.rotate(sway*1.4);
  g.fillStyle=base;g.beginPath();
  g.moveTo(-s*.55,-s*1.1);g.quadraticCurveTo(-s*.75,0,0,s*.3);g.quadraticCurveTo(s*.75,0,s*.55,-s*1.1);
  g.lineTo(s*.28,-s*.65);g.lineTo(0,-s*1.25);g.lineTo(-s*.28,-s*.65);g.closePath();g.fill();
  g.fillStyle=lite;g.beginPath();g.moveTo(0,-s*1.25);g.quadraticCurveTo(-s*.42,-s*.2,0,s*.3);g.quadraticCurveTo(s*.42,-s*.2,0,-s*1.25);g.fill();
  g.restore();
}

function draw(g,t,w,h){
  const u=Math.min(w,h);
  // cielo
  let k=g.createLinearGradient(0,0,0,h*.75);
  if(night){k.addColorStop(0,'#0b1030');k.addColorStop(.6,'#2a2360');k.addColorStop(1,'#5b3a7a')}
  else{k.addColorStop(0,'#7cc4f0');k.addColorStop(.65,'#cfeaf7');k.addColorStop(1,'#ffe3cf')}
  g.fillStyle=k;g.fillRect(0,0,w,h);
  if(night){
    const r=rnd(99);g.fillStyle='#fff';
    for(let i=0;i<90;i++){const a=.4+.6*Math.abs(Math.sin(TAU*(t*2+r())));g.globalAlpha=a;g.beginPath();g.arc(r()*w,r()*h*.55,u*.0022*(1+r()),0,TAU);g.fill()}
    g.globalAlpha=1;g.fillStyle='#f7f3da';g.shadowColor='#f7f3da';g.shadowBlur=u*.06;
    g.beginPath();g.arc(w*.78,h*.14,u*.07,0,TAU);g.fill();g.shadowBlur=0;
  }else{
    g.fillStyle='#fff6c8';g.shadowColor='#ffe680';g.shadowBlur=u*.1;
    g.beginPath();g.arc(w*.22,h*.13,u*.08,0,TAU);g.fill();g.shadowBlur=0;
    g.fillStyle='#ffffffcc';
    for(let i=0;i<3;i++){const cx=((i*.37+.1+t)%1.4-.2)*w,cy=h*(.2+i*.07);
      for(let j=0;j<4;j++){g.beginPath();g.ellipse(cx+j*u*.05,cy+(j%2)*-u*.015,u*.07,u*.035,0,0,TAU);g.fill()}}
  }
  // colinas
  g.fillStyle=night?'#1d4a4a':'#8fcf8a';
  g.beginPath();g.moveTo(0,h);g.lineTo(0,h*.66);g.bezierCurveTo(w*.3,h*.58,w*.6,h*.74,w,h*.62);g.lineTo(w,h);g.fill();
  g.fillStyle=night?'#163a3c':'#5fb36a';
  g.beginPath();g.moveTo(0,h);g.lineTo(0,h*.75);g.bezierCurveTo(w*.35,h*.68,w*.7,h*.82,w,h*.72);g.lineTo(w,h);g.fill();
  // tulipanes
  for(const f of flowers){
    const y=h*(.74+f.d*.25),s=u*(.018+f.d*.05);
    tulip(g,f.x*w,y,s,f,t);
  }
  if(night){g.fillStyle='#0a0a3a44';g.fillRect(0,0,w,h)}
  // luciérnagas
  if(night){
    g.globalCompositeOperation='lighter';
    for(const m of flies){
      const x=(m.x+Math.sin(TAU*(m.fx*t+m.p))*.05)*w,y=(m.y+Math.cos(TAU*(m.fy*t+m.q))*.035)*h;
      const a=Math.pow(.5+.5*Math.sin(TAU*(2*t+m.g)),1.5),r=u*.03*m.s;
      const gr=g.createRadialGradient(x,y,0,x,y,r);
      gr.addColorStop(0,`rgba(255,250,150,${.95*a})`);gr.addColorStop(.25,`rgba(220,255,110,${.45*a})`);gr.addColorStop(1,'rgba(200,255,80,0)');
      g.fillStyle=gr;g.beginPath();g.arc(x,y,r,0,TAU);g.fill();
    }
    g.globalCompositeOperation='source-over';
  }
  // texto
  const T=$('txt').value;
  if(T){
    const fs=u*(w<h?.075:.09);
    g.font=`${fs}px ${$('font').value}`;g.textAlign='center';g.textBaseline='middle';
    g.shadowColor=night?'#000a':'#0006';g.shadowBlur=fs*.2;g.shadowOffsetY=fs*.04;
    g.fillStyle='#fff';
    const words=T.split(' '),lines=[];let cur='';
    for(const wd of words){const tt=cur?cur+' '+wd:wd;if(g.measureText(tt).width>w*.85&&cur){lines.push(cur);cur=wd}else cur=tt}
    lines.push(cur);
    lines.forEach((l,i)=>g.fillText(l,w/2,h*(w<h?.32:.3)+(i-(lines.length-1)/2)*fs*1.2));
    g.shadowColor='transparent';
  }
}

// vista previa
function resize(){const[w,h]=size();cv.width=w;cv.height=h;build()}
function loop(){draw(ctx,(performance.now()/4000)%1,cv.width,cv.height);requestAnimationFrame(loop)}

function save(blob,name){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000)}

$('png').onclick=()=>{
  const[w,h]=size(true),c=document.createElement('canvas');c.width=w;c.height=h;
  draw(c.getContext('2d'),.25,w,h);
  c.toBlob(b=>save(b,'jardin-tulipanes-'+(night?'noche':'dia')+'.png'));
};

// codificador GIF mínimo (paleta fija 6x7x6 con dithering)
function encodeGIF(frames,w,h,delay){
  const o=[],p=(...a)=>{for(const x of a)o.push(x)},s=n=>p(n&255,n>>8);
  p(71,73,70,56,57,97);s(w);s(h);p(247,0,0);
  for(let r=0;r<6;r++)for(let g=0;g<7;g++)for(let b=0;b<6;b++)p(r*51,Math.round(g*42.5),b*51);
  for(let i=252;i<256;i++)p(0,0,0);
  p(33,255,11);'NETSCAPE2.0'.split('').forEach(c=>p(c.charCodeAt(0)));p(3,1,0,0,0);
  for(const f of frames){
    p(33,249,4,4);s(delay);p(0,0);p(44);s(0);s(0);s(w);s(h);p(0,8);
    const out=[];let dict=new Map(),next=258,cs=9,buf=0,bits=0;
    const emit=c=>{buf|=c<<bits;bits+=cs;while(bits>=8){out.push(buf&255);buf>>=8;bits-=8}};
    emit(256);let cur=f[0];
    for(let i=1;i<f.length;i++){
      const k=(cur<<8)|f[i],v=dict.get(k);
      if(v!==undefined){cur=v;continue}
      emit(cur);
      if(next===4096){emit(256);dict.clear();next=258;cs=9}
      else{if(next>=(1<<cs))cs++;dict.set(k,next++)}
      cur=f[i];
    }
    emit(cur);emit(257);if(bits>0)out.push(buf&255);
    for(let i=0;i<out.length;i+=255){const ch=out.slice(i,i+255);p(ch.length);for(const x of ch)o.push(x)}
    p(0);
  }
  p(59);return new Uint8Array(o);
}
const BAY=[0,8,2,10,12,4,14,6,3,11,1,9,15,7,13,5];
$('gif').onclick=async()=>{
  const m=$('msg'),btn=$('gif');btn.disabled=true;
  const p=$('fmt').value==='p',w=p?360:640,h=p?640:360,N=36;
  const c=document.createElement('canvas');c.width=w;c.height=h;
  const g=c.getContext('2d',{willReadFrequently:true}),frames=[];
  for(let i=0;i<N;i++){
    m.textContent=`Creando GIF… ${Math.round(i/N*100)}%`;
    await new Promise(r=>setTimeout(r));
    draw(g,i/N,w,h);
    const d=g.getImageData(0,0,w,h).data,ix=new Uint8Array(w*h);
    for(let y=0,j=0;y<h;y++)for(let x=0;x<w;x++,j++){
      const e=(BAY[(x&3)|((y&3)<<2)]-7.5)*3.2,q=j*4;
      const R=Math.min(5,Math.max(0,Math.round((d[q]+e)/51))),G=Math.min(6,Math.max(0,Math.round((d[q+1]+e)/42.5))),B=Math.min(5,Math.max(0,Math.round((d[q+2]+e)/51)));
      ix[j]=R*42+G*6+B;
    }
    frames.push(ix);
  }
  save(new Blob([encodeGIF(frames,w,h,8)],{type:'image/gif'}),'jardin-tulipanes-'+(night?'noche':'dia')+'.gif');
  m.textContent='¡Listo! GIF descargado 🌷';btn.disabled=false;
};

$('dia').onclick=()=>night=false;
$('noche').onclick=()=>night=true;
$('fmt').onchange=resize;
$('n').oninput=build;$('col').onchange=build;
$('seed').onclick=()=>{seed++;build()};
resize();loop();
</script>
</body>
</html>
