<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Jardín de tulipanes</title>
<style>
:root{--bg:#faf6f1;--fg:#3a2a33;--card:#fff;--ac:#d6457a;--bd:#8883;--soft:#8881}
@media(prefers-color-scheme:dark){:root{--bg:#1b1722;--fg:#f1e8ee;--card:#2a2433}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;font-family:system-ui,sans-serif;background:var(--bg);color:var(--fg)}
.app{display:grid;grid-template-columns:1fr 360px;height:100dvh}
#stage{display:flex;align-items:center;justify-content:center;padding:24px;min-width:0;min-height:0}
canvas{border-radius:16px;box-shadow:0 10px 40px #0004;display:block;flex:none}
#panel{overflow:auto;padding:20px;background:var(--card);border-left:1px solid var(--bd);display:flex;flex-direction:column;gap:18px;padding-bottom:max(20px,env(safe-area-inset-bottom))}
h1{margin:0;font-size:1.25rem}
.grp{display:flex;flex-direction:column;gap:8px}
.lbl{font-size:.8rem;font-weight:600;opacity:.75;display:flex;justify-content:space-between}
input[type=text],select,button{font:inherit;min-height:44px;padding:8px 12px;border-radius:10px;border:1px solid var(--bd);background:transparent;color:inherit}
select{background:var(--card)}
input[type=range]{width:100%;min-height:32px;accent-color:var(--ac)}
button{cursor:pointer;font-weight:600}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:4px;background:var(--soft);padding:4px;border-radius:12px}
.seg button{border:0;border-radius:9px;min-height:40px}
.seg button[aria-pressed=true]{background:var(--ac);color:#fff}
.sw{display:flex;gap:10px;flex-wrap:wrap}
.sw button{width:40px;height:40px;min-height:0;padding:0;border-radius:50%;border:3px solid transparent;box-shadow:0 0 0 1px var(--bd)}
.sw button[aria-pressed=true]{border-color:var(--card);box-shadow:0 0 0 3px var(--ac)}
.btn{background:var(--ac);color:#fff;border:0}
.btn:disabled{opacity:.6;cursor:wait}
.sec{background:transparent}
#bar{height:6px;border-radius:3px;background:var(--soft);overflow:hidden;display:none}
#bar i{display:block;height:100%;width:0;background:var(--ac)}
#msg{font-size:.8rem;opacity:.8;min-height:1.2em}
.hint{font-size:.75rem;opacity:.65;line-height:1.4;margin:0}

@media(max-width:860px){
  .app{display:flex;flex-direction:column;height:auto;min-height:100dvh}
  #stage{position:sticky;top:0;z-index:5;height:46dvh;padding:10px;background:var(--bg)}
  #panel{border-left:0;border-radius:22px 22px 0 0;box-shadow:0 -6px 24px #0002;overflow:visible;flex:1}
}
@media(max-width:860px) and (max-height:520px){
  .app{display:grid;grid-template-columns:1fr 300px;height:100dvh}
  #stage{position:static;height:auto}
  #panel{overflow:auto;border-radius:0}
}
</style>
</head>
<body>
<div class="app">
<div id="stage"><canvas id="c"></canvas></div>
<div id="panel">
  <h1>🌷 Mi jardín de tulipanes</h1>

  <div class="grp"><div class="lbl">Momento</div>
    <div class="seg" id="tod">
      <button data-v="d" aria-pressed="true">☀️ Día</button>
      <button data-v="n" aria-pressed="false">🌙 Noche</button>
    </div>
  </div>

  <div class="grp"><div class="lbl">Formato</div>
    <div class="seg" id="fmt">
      <button data-v="p" aria-pressed="true">📱 Celular</button>
      <button data-v="l" aria-pressed="false">💻 Laptop</button>
    </div>
  </div>

  <div class="grp"><div class="lbl">Texto</div>
    <input type="text" id="txt" value="Para ti 🌷" maxlength="60" enterkeyhint="done">
  </div>

  <div class="grp"><div class="lbl">Letra</div>
    <select id="font">
      <option value="Georgia, serif">Elegante</option>
      <option value="'Brush Script MT', cursive">Manuscrita</option>
      <option value="system-ui, sans-serif">Moderna</option>
      <option value="'Courier New', monospace">Máquina</option>
    </select>
  </div>

  <div class="grp"><div class="lbl">Color de tulipanes</div>
    <div class="sw" id="col"></div>
  </div>

  <div class="grp"><div class="lbl"><span>Cantidad de tulipanes</span><span id="nv">30</span></div>
    <input type="range" id="n" min="8" max="60" value="30">
  </div>

  <button class="sec" id="seed">🌱 Replantar jardín</button>

  <div class="grp"><div class="lbl">Descargar</div>
    <button class="btn" id="png">🖼️ Fondo (PNG)</button>
    <div class="seg" id="q">
      <button data-v="720" aria-pressed="true">HD 720p</button>
      <button data-v="1080" aria-pressed="false">Full HD 1080p</button>
    </div>
    <button class="btn" id="vid">🎬 Video para fondo animado</button>
    <div id="bar"><i></i></div>
    <div id="msg"></div>
    <p class="hint">El video dura 8 segundos y está hecho para repetirse sin cortes. Mientras se graba, no cambies de pestaña.</p>
  </div>
</div>
</div>

<script>
const $=id=>document.getElementById(id);
const cv=$('c'),ctx=cv.getContext('2d'),stage=$('stage');
let night=false,seed=1,flowers=[],flies=[],recording=false;
let portrait=innerWidth<860||innerHeight>innerWidth,colorSel='mix',quality='720';
const TAU=Math.PI*2,CYCLE=4,LOOPS=2; // un ciclo = 4 s; el video = 2 ciclos = 8 s
const rnd=s=>()=>(s=(s*16807)%2147483647)/2147483647;

const COLORS=[['mix','conic-gradient(#e0407f,#e8a63a,#8a4cc0,#e0407f)','Mixtos'],['330','hsl(330,75%,52%)','Rosa'],['350','hsl(350,75%,50%)','Rojo'],['48','hsl(48,85%,55%)','Amarillo'],['280','hsl(280,60%,50%)','Morado'],['22','hsl(22,85%,55%)','Naranja'],['0w','#f4f0f4','Blanco']];
COLORS.forEach(([v,bg,name])=>{const b=document.createElement('button');b.dataset.v=v;b.style.background=bg;b.title=b.ariaLabel=name;b.setAttribute('aria-pressed',v===colorSel);$('col').appendChild(b)});

function seg(id,cb){
  const el=$(id);
  el.addEventListener('click',e=>{
    const b=e.target.closest('button');if(!b)return;
    el.querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',x===b));
    cb(b.dataset.v);
  });
}
function setSeg(id,v){$(id).querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',x.dataset.v===v))}

function outSize(){
  const hd=quality==='1080';
  const a=hd?1080:720,b=hd?1920:1280;
  return portrait?[a,b]:[b,a];
}

function build(){
  const r=rnd(seed*7919+13),n=+$('n').value,c=colorSel;
  const hues=[330,350,48,280,22,0];
  flowers=[];
  for(let i=0;i<n;i++){
    const d=r();
    let h=c==='mix'?hues[(r()*hues.length)|0]:parseInt(c),white=c==='0w'||(c==='mix'&&h===0);
    flowers.push({x:r(),d,h,white,ph:r(),leaf:r()>.5});
  }
  flowers.sort((a,b)=>a.d-b.d);
  flies=[];
  for(let i=0;i<45;i++)flies.push({x:r(),y:.35+r()*.6,fx:1+((r()*3)|0),fy:1+((r()*3)|0),p:r(),q:r(),g:r(),s:.6+r()});
}

function tulip(g,x,y,s,f,t){
  const sway=Math.sin(TAU*(t+f.ph))*.08;
  const H=s*3.4,tx=x+Math.sin(sway)*H,ty=y-H*Math.cos(sway);
  g.strokeStyle=night?'#2f6b4a':'#3f9a4f';g.lineWidth=s*.14;g.lineCap='round';
  g.beginPath();g.moveTo(x,y);g.quadraticCurveTo(x+Math.sin(sway)*H*.2,y-H*.5,tx,ty);g.stroke();
  g.fillStyle=night?'#2a5f42':'#4aaa5a';
  const L=f.leaf?1:-1;
  g.beginPath();g.moveTo(x,y);g.quadraticCurveTo(x+L*s*1.3,y-H*.35,x+L*s*.5+Math.sin(sway)*s,y-H*.65);g.quadraticCurveTo(x+L*s*.1,y-H*.3,x,y);g.fill();
  const base=f.white?`hsl(0,0%,${night?82:96}%)`:`hsl(${f.h},75%,${night?42:52}%)`;
  const lite=f.white?`hsl(300,30%,${night?90:100}%)`:`hsl(${f.h},80%,${night?55:66}%)`;
  g.save();g.translate(tx,ty);g.rotate(sway*1.4);
  g.fillStyle=base;g.beginPath();
  g.moveTo(-s*.55,-s*1.1);g.quadraticCurveTo(-s*.75,0,0,s*.3);g.quadraticCurveTo(s*.75,0,s*.55,-s*1.1);
  g.lineTo(s*.28,-s*.65);g.lineTo(0,-s*1.25);g.lineTo(-s*.28,-s*.65);g.closePath();g.fill();
  g.fillStyle=lite;g.beginPath();g.moveTo(0,-s*1.25);g.quadraticCurveTo(-s*.42,-s*.2,0,s*.3);g.quadraticCurveTo(s*.42,-s*.2,0,-s*1.25);g.fill();
  g.restore();
}

// t va de 0 a 1 y TODO se repite exactamente en t=1 (loop perfecto)
function draw(g,t,w,h){
  const u=Math.min(w,h);
  let k=g.createLinearGradient(0,0,0,h*.75);
  if(night){k.addColorStop(0,'#0b1030');k.addColorStop(.6,'#2a2360');k.addColorStop(1,'#5b3a7a')}
  else{k.addColorStop(0,'#7cc4f0');k.addColorStop(.65,'#cfeaf7');k.addColorStop(1,'#ffe3cf')}
  g.fillStyle=k;g.fillRect(0,0,w,h);
  if(night){
    const r=rnd(99);g.fillStyle='#fff';
    for(let i=0;i<90;i++){const a=.4+.6*Math.abs(Math.sin(TAU*(t*2+r())));g.globalAlpha=a;g.beginPath();g.arc(r()*w,r()*h*.55,u*.0022*(1+r()),0,TAU);g.fill()}
    g.globalAlpha=1;g.fillStyle='#f7f3da';g.shadowColor='#f7f3da';g.shadowBlur=u*.06;
    g.beginPath();g.arc(w*.78,h*.14,u*.07,0,TAU);g.fill();g.shadowBlur=0;
  }else{
    g.fillStyle='#fff6c8';g.shadowColor='#ffe680';g.shadowBlur=u*.1;
    g.beginPath();g.arc(w*.22,h*.13,u*.08,0,TAU);g.fill();g.shadowBlur=0;
    g.fillStyle='#ffffffcc';
    for(let i=0;i<3;i++){const cx=(((i*.37+.1+t)%1)*1.6-.3)*w,cy=h*(.2+i*.07);
      for(let j=0;j<4;j++){g.beginPath();g.ellipse(cx+j*u*.05,cy+(j%2)*-u*.015,u*.07,u*.035,0,0,TAU);g.fill()}}
  }
  g.fillStyle=night?'#1d4a4a':'#8fcf8a';
  g.beginPath();g.moveTo(0,h);g.lineTo(0,h*.66);g.bezierCurveTo(w*.3,h*.58,w*.6,h*.74,w,h*.62);g.lineTo(w,h);g.fill();
  g.fillStyle=night?'#163a3c':'#5fb36a';
  g.beginPath();g.moveTo(0,h);g.lineTo(0,h*.75);g.bezierCurveTo(w*.35,h*.68,w*.7,h*.82,w,h*.72);g.lineTo(w,h);g.fill();
  for(const f of flowers){
    const y=h*(.74+f.d*.25),s=u*(.018+f.d*.05);
    tulip(g,f.x*w,y,s,f,t);
  }
  if(night){g.fillStyle='#0a0a3a44';g.fillRect(0,0,w,h)}
  if(night){
    g.globalCompositeOperation='lighter';
    for(const m of flies){
      const x=(m.x+Math.sin(TAU*(m.fx*t+m.p))*.05)*w,y=(m.y+Math.cos(TAU*(m.fy*t+m.q))*.035)*h;
      const a=Math.pow(.5+.5*Math.sin(TAU*(2*t+m.g)),1.5),r=u*.03*m.s;
      const gr=g.createRadialGradient(x,y,0,x,y,r);
      gr.addColorStop(0,`rgba(255,250,150,${.95*a})`);gr.addColorStop(.25,`rgba(220,255,110,${.45*a})`);gr.addColorStop(1,'rgba(200,255,80,0)');
      g.fillStyle=gr;g.beginPath();g.arc(x,y,r,0,TAU);g.fill();
    }
    g.globalCompositeOperation='source-over';
  }
  const T=$('txt').value;
  if(T){
    const fs=u*(w<h?.075:.09);
    g.font=`${fs}px ${$('font').value}`;g.textAlign='center';g.textBaseline='middle';
    g.shadowColor=night?'#000a':'#0006';g.shadowBlur=fs*.2;g.shadowOffsetY=fs*.04;
    g.fillStyle='#fff';
    const words=T.split(' '),lines=[];let cur='';
    for(const wd of words){const tt=cur?cur+' '+wd:wd;if(g.measureText(tt).width>w*.85&&cur){lines.push(cur);cur=wd}else cur=tt}
    lines.push(cur);
    lines.forEach((l,i)=>g.fillText(l,w/2,h*(w<h?.32:.3)+(i-(lines.length-1)/2)*fs*1.2));
    g.shadowColor='transparent';g.shadowBlur=0;g.shadowOffsetY=0;
  }
}

// Vista previa: se ajusta al espacio disponible
function fit(){
  const r=stage.getBoundingClientRect(),cs=getComputedStyle(stage);
  const pw=r.width-parseFloat(cs.paddingLeft)-parseFloat(cs.paddingRight);
  const ph=r.height-parseFloat(cs.paddingTop)-parseFloat(cs.paddingBottom);
  if(pw<=0||ph<=0)return;
  const ar=portrait?9/16:16/9;
  let cw=pw,ch=cw/ar;if(ch>ph){ch=ph;cw=ch*ar}
  cv.style.width=cw+'px';cv.style.height=ch+'px';
  const dpr=Math.min(devicePixelRatio||1,2);
  cv.width=Math.round(cw*dpr);cv.height=Math.round(ch*dpr);
}
function loop(){
  if(!recording)draw(ctx,(performance.now()/1000/CYCLE)%1,cv.width,cv.height);
  requestAnimationFrame(loop);
}

function save(blob,name){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),4000)}
const tag=()=>night?'noche':'dia';

$('png').onclick=()=>{
  const c=document.createElement('canvas');
  c.width=portrait?1080:1920;c.height=portrait?1920:1080;
  draw(c.getContext('2d'),.25,c.width,c.height);
  c.toBlob(b=>save(b,'jardin-tulipanes-'+tag()+'.png'));
};

// Video: graba 2 ciclos exactos (8 s) en tiempo real
$('vid').onclick=()=>{
  const m=$('msg'),btn=$('vid'),bar=$('bar');
  if(!window.MediaRecorder||!HTMLCanvasElement.prototype.captureStream){m.textContent='Tu navegador no puede grabar video. Prueba con Chrome, Edge o Safari actualizado.';return}
  const mime=['video/mp4;codecs=avc1','video/mp4','video/webm;codecs=vp9','video/webm;codecs=vp8','video/webm'].find(t=>MediaRecorder.isTypeSupported(t));
  if(!mime){m.textContent='Tu navegador no soporta grabación de video.';return}
  const ext=mime.includes('mp4')?'mp4':'webm',[w,h]=outSize();
  const c=document.createElement('canvas');c.width=w;c.height=h;
  const g=c.getContext('2d');
  draw(g,0,w,h);
  const rec=new MediaRecorder(c.captureStream(30),{mimeType:mime,videoBitsPerSecond:quality==='1080'?14e6:8e6});
  const parts=[];rec.ondataavailable=e=>{if(e.data.size)parts.push(e.data)};
  const DUR=CYCLE*LOOPS;
  rec.onstop=()=>{
    recording=false;btn.disabled=false;bar.style.display='none';
    save(new Blob(parts,{type:mime}),`jardin-tulipanes-${tag()}-loop.${ext}`);
    m.textContent=`¡Listo! Video ${ext.toUpperCase()} descargado 🌷`;
  };
  recording=true;btn.disabled=true;bar.style.display='block';
  let t0;
  rec.start();
  const tick=now=>{
    if(t0===undefined)t0=now;
    const el=(now-t0)/1000;
    bar.firstElementChild.style.width=Math.min(100,el/DUR*100)+'%';
    m.textContent=`Grabando… ${Math.max(0,Math.ceil(DUR-el))} s`;
    if(el>=DUR){rec.stop();return}
    draw(g,(el/CYCLE)%1,w,h);
    requestAnimationFrame(tick);
  };
  requestAnimationFrame(tick);
};

seg('tod',v=>night=v==='n');
seg('fmt',v=>{portrait=v==='p';fit()});
seg('q',v=>quality=v);
$('col').addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;
  colorSel=b.dataset.v;
  $('col').querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',x===b));
  build();
});
$('n').oninput=()=>{$('nv').textContent=$('n').value;build()};
$('seed').onclick=()=>{seed++;build()};
$('txt').addEventListener('keydown',e=>{if(e.key==='Enter')e.target.blur()});

setSeg('fmt',portrait?'p':'l');
new ResizeObserver(fit).observe(stage);
addEventListener('resize',fit);
build();fit();loop();
</script>
</body>
</html>
